name: Data Forge

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Clone repo
        uses: actions/checkout@v7

      - name: Install just
        uses: extractions/setup-just@v4

      - name: Build
        run: just ci-up

      - name: Unit Test
        run: just ci-test

  deploy:
    name: Deploy to Prod
    runs-on: [self-hosted, x64, linux]
    timeout-minutes: 10
    needs: build-and-test

    steps:
      - name: Pull repo to Prod
        env:
          PROJECT_DIR: ${{ secrets.PROJECT_DIR }}
        run: |
          cd "$PROJECT_DIR"
          git fetch origin main && git reset --hard origin/main
          just pipeline