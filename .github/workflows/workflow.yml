name: Data Forge

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Clone repo
        uses: actions/checkout@v7

      - name: Setup uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.12.13"
          cache-python: 'true'
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Unit Test
        run: |
          uv run pytest

      - name: End to End Test
        run: just ci
