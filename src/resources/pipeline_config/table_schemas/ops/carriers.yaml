columns:
  - name: carrier_code
    type: VARCHAR(15)
    nullability: "no"
  - name: carrier_name
    type: VARCHAR(120)
    nullability: "no"
  - name: mode
    type: VARCHAR(10)
    nullability: "no"
  - name: cost_index
    type: NUMERIC(6,3)
    nullability: "no"
  - name: published_otd_rate
    type: NUMERIC(5,3)
